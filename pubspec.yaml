name: passport_photo_app
description: "On-device passport, visa, and ID photo studio for 20+ countries."
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management & routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Image input
  camera: ^0.11.0+2
  image_picker: ^1.1.2

  # Face detection (on-device, ML Kit)
  google_mlkit_face_detection: ^0.13.0

  # Image processing & export
  image: ^4.5.2
  path_provider: ^2.1.5
  path: ^1.9.0
  saver_gallery: ^4.0.1

  # Persistence
  shared_preferences: ^2.3.3

  # Permissions
  permission_handler: ^11.3.1

  # Monetization — native store billing only, no wrapper SDK.
  in_app_purchase: ^3.2.0

  # Opening the privacy policy from inside the app.
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Drives the store-screenshot run and the on-device crop-geometry probe.
  # SDK-vendored, so it adds nothing to a release build.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Branding generators. Build-time only — neither ships in the binary.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/specs/

# ---------------------------------------------------------------------------
# App icon. The art is generated by store_assets/branding/make_branding.py;
# after changing it run store_assets/branding/render.sh, then:
#   dart run flutter_launcher_icons
# Re-check ios/Runner.xcodeproj/project.pbxproj afterwards — 0.14.4 overwrites
# the project-level ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS
# with the string "AppIcon". See store_assets/README.md §2.
# ---------------------------------------------------------------------------
flutter_launcher_icons:
  image_path: "store_assets/branding/icon_master.png"
  # iOS: opaque, alpha stripped — the App Store rejects icons with alpha.
  ios: true
  remove_alpha_ios: true
  # Android: legacy mipmaps plus an adaptive icon whose background plate is the
  # brand's Ink Navy, so whatever a launcher mask cuts away stays on-brand.
  android: "ic_launcher"
  adaptive_icon_background: "#0C2350"
  adaptive_icon_foreground: "store_assets/branding/icon_foreground.png"
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

# ---------------------------------------------------------------------------
# Launch screen:
#   dart run flutter_native_splash:create
# Paper in light, Night in dark — the same two values the scaffold uses
# (BrandColors in lib/app/theme.dart), so the launch screen hands over to the
# first Flutter frame without a flash. The logo carries its own navy plate
# because the mark's photo card is white and would vanish on Paper.
# ---------------------------------------------------------------------------
flutter_native_splash:
  color: "#F7F9FC"
  color_dark: "#0D1524"
  image: "store_assets/branding/splash_logo.png"
  image_dark: "store_assets/branding/splash_logo.png"
  android_12:
    color: "#F7F9FC"
    color_dark: "#0D1524"
    # Android 12+ masks the splash icon to a circle over the middle two thirds
    # of the drawable, so this art is drawn to that safe area specifically and
    # sits on its own navy plate rather than on the window colour.
    image: "store_assets/branding/splash_icon_android12.png"
    image_dark: "store_assets/branding/splash_icon_android12.png"
    icon_background_color: "#0C2350"
    icon_background_color_dark: "#0C2350"
  android: true
  ios: true
  web: false
  fullscreen: false
