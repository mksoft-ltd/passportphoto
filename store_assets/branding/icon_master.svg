      <stop offset="0" stop-color="#173F8E"/>
      <stop offset="0.55" stop-color="#0C2350"/>
      <stop offset="1" stop-color="#071634"/>
    </linearGradient>
    <linearGradient id="card" gradientUnits="userSpaceOnUse"
