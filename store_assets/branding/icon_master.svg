    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#plate)"/>
  <g transform="translate(59.88 87.00) scale(0.90425)">
      <path d="M 290.0 64.0 L 174.0 64.0 L 174.0 180.0" fill="none" stroke="#7FB0FF" stroke-width="26.0" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 710.0 64.0 L 826.0 64.0 L 826.0 180.0" fill="none" stroke="#7FB0FF" stroke-width="26.0" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 290.0 876.0 L 174.0 876.0 L 174.0 760.0" fill="none" stroke="#7FB0FF" stroke-width="26.0" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 710.0 876.0 L 826.0 876.0 L 826.0 760.0" fill="none" stroke="#7FB0FF" stroke-width="26.0" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="220.0" y="110.0" width="560.0" height="720.0"
