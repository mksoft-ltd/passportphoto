<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Passport Photo Studio app icon</title>
  <defs>
    <linearGradient id="plate" gradientUnits="userSpaceOnUse"
